name: EAS Release

on:
  workflow_dispatch:
  push:
    tags: [v*]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Gamenote
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: Gamenote/.nvmrc
          cache: npm
          cache-dependency-path: Gamenote/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
