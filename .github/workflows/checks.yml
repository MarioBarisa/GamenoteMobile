name: Provjere aplikacije
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  EXPO_NO_DOTENV: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Gamenote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: Gamenote/.nvmrc
          cache: npm
          cache-dependency-path: Gamenote/package-lock.json
      - run: npm ci
      - run: npx --no-install expo customize tsconfig.json
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - run: node --test tests/*.test.cjs
      - name: Expo Doctor
        run: npx --yes expo-doctor@1.21.9
        continue-on-error: true
